  <title>장수한우곱창 원당점</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #1a1d24;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    /* ── 로딩 화면 ── */
    .loading-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #2d3238 0%, #1a1d24 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; overflow: hidden;
    }
    .calculator { width: 120px; height: 160px; background: #3a3f47; border-radius: 12px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: calculator-bounce 2s ease-in-out infinite; }
    @keyframes calculator-bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
    .calc-screen { width:100%; height:40px; background:#1f2329; border-radius:6px; margin-bottom:8px; display:flex; align-items:center; justify-content:flex-end; padding:8px; font-size:18px; font-weight:700; color:#c9a055; animation:numbers-change 1.5s infinite; }
    @keyframes numbers-change { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .calc-buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
    .calc-btn { aspect-ratio:1; background:#2d3238; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#8b8b8b; font-weight:600; }
    .calc-btn.active { background:#c9a055; color:#2d3238; animation:button-press 0.3s ease-out; }
    @keyframes button-press { 0%{transform:scale(1)} 50%{transform:scale(0.9)} 100%{transform:scale(1)} }
    .money-container { position:absolute; inset:0; pointer-events:none; }
    .money { position:absolute; font-size:32px; animation:money-float 3s ease-in-out infinite; opacity:0.6; }
    .money:nth-child(1){left:10%;top:20%;animation-delay:0s}
    .money:nth-child(2){right:15%;top:30%;animation-delay:0.5s}
    .money:nth-child(3){left:20%;bottom:25%;animation-delay:1s}
    .money:nth-child(4){right:10%;bottom:35%;animation-delay:1.5s}
    .money:nth-child(5){left:50%;top:15%;animation-delay:0.7s}
    @keyframes money-float { 0%,100%{transform:translateY(0) rotate(0deg)} 25%{transform:translateY(-30px) rotate(10deg)} 50%{transform:translateY(-60px) rotate(-10deg)} 75%{transform:translateY(-30px) rotate(5deg)} }
    .loading-text { margin-top:32px; color:#c9a055; font-size:16px; font-weight:600; animation:text-pulse 1.5s ease-in-out infinite; }
    @keyframes text-pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* ── 로그인 ── */
    .login-container { display:none; position:fixed; inset:0; background:#1a1d24; align-items:center; justify-content:center; z-index:9998; padding:20px; }
    .login-box { background:#2d3238; padding:40px 32px; border-radius:20px; width:100%; max-width:360px; text-align:center; }
    .login-logo { font-size:48px; margin-bottom:16px; }
    .login-title { font-size:22px; font-weight:700; color:#c9a055; margin-bottom:6px; }
    .login-subtitle { color:#8b8b8b; font-size:14px; margin-bottom:32px; }
    .login-input { width:100%; padding:14px 18px; background:#1a1d24; border:2px solid #c9a055; border-radius:12px; color:#fff; font-size:18px; text-align:center; letter-spacing:4px; margin-bottom:16px; }
    .login-input:focus { outline:none; border-color:#d4af6a; }
    .login-btn { width:100%; padding:14px; background:#c9a055; border:none; border-radius:12px; color:#2d3238; font-size:16px; font-weight:700; cursor:pointer; }
    .error-message { color:#ff6b6b; font-size:13px; margin-top:12px; display:none; }

    /* ── 헤더 ── */
    .header { background:#1a1d24; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #2d3238; }
    .header-logo { font-size:17px; font-weight:700; color:#c9a055; }
    .header-logo::before { content:'🥩'; margin-right:6px; }
    .date-selectors { display:flex; gap:8px; }
    .date-select { padding:7px 12px; background:#2d3238; border:1px solid #c9a055; border-radius:8px; color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
    .date-select:focus { outline:none; }

    /* ── 핵심 지표 3개 ── */
    .key-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:16px 16px 8px; }
    .metric-card { background:#2d3238; border-radius:12px; padding:14px 10px; text-align:center; }
    .metric-card.highlight { border:1px solid rgba(201,160,85,0.5); }
    .metric-label { font-size:10px; color:#8b8b8b; font-weight:600; margin-bottom:6px; letter-spacing:0.3px; }
    .metric-value { font-size:18px; font-weight:800; color:#fff; letter-spacing:-0.5px; }
    .metric-value.up { color:#4ade80; }
    .metric-value.down { color:#f87171; }
    .metric-change { font-size:10px; margin-top:4px; font-weight:600; }
    .metric-change.up { color:#4ade80; }
    .metric-change.down { color:#f87171; }
    .metric-sub { font-size:10px; color:#8b8b8b; margin-top:4px; }

    /* ── 원가율 신호등 ── */
    .section-block { padding:8px 16px 4px; }
    .section-block-title { font-size:13px; font-weight:700; color:#b8bec7; margin-bottom:10px; letter-spacing:0.3px; }
    .traffic-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .traffic-item { background:#2d3238; border-radius:10px; padding:12px 14px; display:flex; align-items:center; gap:10px; }
    .traffic-dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; }
    .traffic-dot.green { background:#4ade80; box-shadow:0 0 6px rgba(74,222,128,0.5); }
    .traffic-dot.yellow { background:#fbbf24; box-shadow:0 0 6px rgba(251,191,36,0.5); }
    .traffic-dot.red { background:#f87171; box-shadow:0 0 6px rgba(248,113,113,0.5); }
    .traffic-info { flex:1; min-width:0; }
    .traffic-name { font-size:11px; color:#8b8b8b; font-weight:600; }
    .traffic-pct { font-size:15px; font-weight:800; color:#fff; }
    .traffic-target { font-size:10px; color:#6b7280; margin-top:1px; }

    /* ── 목표 & 예상 마감 ── */
    .forecast-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .forecast-card { background:#2d3238; border-radius:12px; padding:14px; min-width:0; overflow:hidden; }
    .forecast-title { font-size:11px; color:#8b8b8b; font-weight:700; margin-bottom:10px; letter-spacing:0.3px; }
    .goal-input-row { display:flex; gap:6px; margin-bottom:8px; }
    .goal-input { flex:1; background:#1a1d24; border:1px solid #3a3f47; border-radius:7px; color:#fff; font-size:12px; padding:7px 8px; min-width:0; }
    .goal-input:focus { outline:none; border-color:#c9a055; }
    .goal-btn { background:#c9a055; border:none; border-radius:7px; color:#1a1d24; font-size:11px; font-weight:700; padding:7px 10px; cursor:pointer; white-space:nowrap; }
    .goal-bar-wrap { background:#1a1d24; border-radius:4px; height:6px; overflow:hidden; margin-bottom:6px; }
    .goal-bar { height:100%; border-radius:4px; transition:width 0.5s ease; }
    .goal-pct { font-size:18px; font-weight:800; color:#fff; }
    .goal-detail { font-size:10px; color:#8b8b8b; margin-top:3px; }
    .goal-hint { font-size:11px; color:#6b7280; }
    .proj-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
    .proj-label { font-size:10px; color:#8b8b8b; font-weight:600; white-space:nowrap; }
    .proj-value { font-size:14px; font-weight:800; color:#fff; white-space:nowrap; }
    .proj-value.up { color:#4ade80; }
    .proj-value.down { color:#f87171; }
    .proj-divider { height:1px; background:#3a3f47; margin:8px 0; }
    .proj-hint { font-size:10px; color:#6b7280; text-align:right; white-space:nowrap; }

    /* ── 전월 비교표 ── */
    .compare-table { display:flex; flex-direction:column; gap:0; }
    .compare-row { display:flex; align-items:center; padding:9px 0; border-bottom:1px solid #3a3f47; }
    .compare-row:last-child { border-bottom:none; }
    .compare-name { font-size:12px; color:#b8bec7; font-weight:600; flex:1; }
    .compare-val { font-size:13px; font-weight:800; color:#fff; min-width:70px; text-align:right; }
    .compare-badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; min-width:58px; text-align:center; margin-left:8px; }
    .badge-up { background:rgba(74,222,128,0.15); color:#4ade80; }
    .badge-dn { background:rgba(248,113,113,0.15); color:#f87171; }
    .badge-eq { background:rgba(107,114,128,0.2); color:#9ca3af; }

    /* ── 계정 그리드 ── */
    .accounts-section { padding:4px 16px 8px; }
    .accounts-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .account-card { background:#2d3238; border-radius:12px; padding:12px 10px; cursor:pointer; transition:all 0.2s ease; display:flex; flex-direction:column; justify-content:center; min-width:0; overflow:hidden; }
    .account-card.expanded, .account-card.has-nested-expanded { grid-column:1/-1; }
    .account-card:active { background:#3a3f47; }
    .account-header { display:flex; align-items:center; gap:8px; }
    .account-icon { width:30px; height:30px; background:rgba(201,160,85,0.15); border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .account-icon svg { width:16px; height:16px; stroke:#c9a055; }
    .account-main { flex:1; display:flex; flex-direction:column; gap:3px; min-width:0; }
    .account-label { font-size:10px; color:#b8bec7; font-weight:700; }
    .account-value { font-size:14px; font-weight:800; letter-spacing:-0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .account-value.positive { color:#3b82f6; }
    .account-value.negative { color:#ef4444; }
    .account-chevron { width:18px; height:18px; color:#6b7280; transition:transform 0.3s ease; flex-shrink:0; }
    .account-card.expanded .account-chevron { transform:rotate(180deg); }
    .account-details { flex-direction:column; display:flex; width:100%; max-height:0; overflow:hidden; transition:max-height 0.3s ease; margin-top:0; }
    .account-details.expanded { max-height:1000px; margin-top:10px; }
    .detail-item { display:flex; justify-content:space-between; align-items:center; padding:7px 10px; background:rgba(0,0,0,0.3); border-radius:6px; margin-bottom:4px; width:100%; box-sizing:border-box; }
    .detail-item:last-child { margin-bottom:0; }
    .detail-label { font-size:11px; color:#b8bec7; font-weight:700; }
    .detail-value { font-size:12px; font-weight:800; white-space:nowrap; }
    .detail-value.positive { color:#3b82f6; }
    .detail-value.negative { color:#ef4444; }
    .detail-item-nested { background:rgba(0,0,0,0.4); border-radius:6px; margin-bottom:4px; width:100%; box-sizing:border-box; cursor:pointer; padding:7px 10px; }
    .detail-item-nested .account-chevron { transition:transform 0.3s ease; }
    .detail-item-nested.expanded .account-chevron { transform:rotate(180deg); }
    .sub-details { display:flex; flex-direction:column; width:100%; padding-left:14px; max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
    .sub-details.expanded { max-height:300px; margin-top:6px; }
    .sub-detail-item { display:flex; justify-content:space-between; padding:5px 8px; background:rgba(0,0,0,0.2); border-radius:4px; margin-bottom:3px; }
    .sub-detail-item:last-child { margin-bottom:0; }

    .hidden { display:none !important; }
  </style>
</head>
<body>

  <!-- 로딩 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="money-container">
      <div class="money">💵</div><div class="money">💴</div>
      <div class="money">💶</div><div class="money">💷</div><div class="money">💰</div>
    </div>
    <div class="calculator">
      <div class="calc-screen">88,888</div>
      <div class="calc-buttons">
        <div class="calc-btn">7</div><div class="calc-btn">8</div><div class="calc-btn">9</div><div class="calc-btn">÷</div>
        <div class="calc-btn">4</div><div class="calc-btn">5</div><div class="calc-btn">6</div><div class="calc-btn">×</div>
        <div class="calc-btn">1</div><div class="calc-btn">2</div><div class="calc-btn">3</div><div class="calc-btn">-</div>
        <div class="calc-btn">0</div><div class="calc-btn">.</div><div class="calc-btn">=</div><div class="calc-btn">+</div>
      </div>
    </div>
    <div class="loading-text">데이터 계산 중...</div>
  </div>

  <!-- 로그인 -->
  <div class="login-container" id="loginContainer">
    <div class="login-box">
      <div class="login-logo">🥩</div>
      <div class="login-title">장수한우곱창 원당점</div>
      <div class="login-subtitle">회계 보고서</div>
      <input type="password" class="login-input" id="passwordInput" placeholder="비밀번호" maxlength="6" inputmode="numeric">
      <button class="login-btn" id="loginBtn">로그인</button>
      <div class="error-message" id="errorMessage">비밀번호가 올바르지 않습니다</div>
    </div>
  </div>

  <!-- 메인 앱 -->
  <div id="mainApp" class="hidden">

    <!-- 헤더 -->
    <div class="header">
      <div class="header-logo">장수한우곱창 원당점</div>
      <div class="date-selectors">
        <select class="date-select" id="yearPicker"></select>
        <select class="date-select" id="monthPicker"></select>
      </div>
    </div>

    <!-- ① 핵심 지표 3개 -->
    <div class="key-metrics">
      <div class="metric-card">
        <div class="metric-label">이번달 매출</div>
        <div class="metric-value" id="metricRevenue">-</div>
        <div class="metric-change" id="metricRevenueChange"></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">순 이익</div>
        <div class="metric-value" id="metricNetProfit">-</div>
        <div class="metric-change" id="metricNetChange"></div>
      </div>
      <div class="metric-card highlight">
        <div class="metric-label">순이익률</div>
        <div class="metric-value" id="metricNetRate">-</div>
        <div class="metric-sub" id="metricDay"></div>
      </div>
    </div>

    <!-- ④ 원가율 신호등 -->
    <div class="section-block">
      <div class="section-block-title">원가율 모니터</div>
      <div class="traffic-grid" id="trafficGrid"></div>
    </div>

    <!-- ②③ 목표 달성률 + 예상 마감 -->
    <div class="section-block" style="margin-top:8px;">
      <div class="forecast-grid">
        <div class="forecast-card">
          <div class="forecast-title">목표 달성률</div>
          <div id="goalSection"></div>
        </div>
        <div class="forecast-card">
          <div class="forecast-title">예상 마감</div>
          <div id="projectionSection"></div>
        </div>
      </div>
    </div>

    <!-- 전월 대비 비교표 -->
    <div class="section-block" style="margin-top:8px;">
      <div class="section-block-title">전월 대비</div>
      <div style="background:#2d3238;border-radius:12px;padding:4px 14px;">
        <div class="compare-table" id="compareTable"></div>
      </div>
    </div>

    <!-- 손익계산서 상세 -->
    <div class="section-block" style="margin-top:8px;">
      <div class="section-block-title">손익계산서 상세</div>
      <div class="accounts-grid" id="accountsGrid"></div>
    </div>

  </div>

      chevron: '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>'
    };

    document.addEventListener('DOMContentLoaded', init);

    let calcInterval;

    function startLoadingAnimation() {
      if (calcInterval) clearInterval(calcInterval);
      const screen = document.querySelector('.calc-screen');
      const buttons = document.querySelectorAll('.calc-btn');
      calcInterval = setInterval(() => {
        screen.textContent = (Math.floor(Math.random() * 90000) + 10000).toLocaleString();
        const btn = buttons[Math.floor(Math.random() * buttons.length)];
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 300);
      }, 500);
    }

    function stopLoadingAnimation() {
      if (calcInterval) clearInterval(calcInterval);
    }

    function init() {
      startLoadingAnimation();
      const saved = localStorage.getItem('jangsuhan_wondang_password');
      if (saved) { APP_STATE.password = saved; showMainApp(); }
      else { showLogin(); }
      document.getElementById('loginBtn').addEventListener('click', handleLogin);
      document.getElementById('passwordInput').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
      initDatePickers();
    }

    function showLogin() {
      stopLoadingAnimation();
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('loginContainer').style.display = 'flex';
    }

    function showMainApp() {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('loginContainer').style.display = 'none';
      document.getElementById('mainApp').classList.remove('hidden');
      loadAllData();
    }

    function handleLogin() {
      const pw = document.getElementById('passwordInput').value;
      if (pw === '940216') {
        APP_STATE.password = pw;
        localStorage.setItem('jangsuhan_wondang_password', pw);
        showMainApp();
      } else {
        document.getElementById('errorMessage').style.display = 'block';
        document.getElementById('passwordInput').value = '';
      }
    }

    function initDatePickers() {
      const yp = document.getElementById('yearPicker');
      const mp = document.getElementById('monthPicker');
      for (let y = 2025; y <= 2027; y++)
        yp.innerHTML += `<option value="${y}" ${y === new Date().getFullYear() ? 'selected' : ''}>${y}년</option>`;
      for (let m = 1; m <= 12; m++)
        mp.innerHTML += `<option value="${m}" ${m === new Date().getMonth() + 1 ? 'selected' : ''}>${m}월</option>`;
      yp.onchange = e => { APP_STATE.currentYear = parseInt(e.target.value); loadAllData(); };
      mp.onchange = e => { APP_STATE.currentMonth = parseInt(e.target.value); loadAllData(); };
    }

    // ── 캐시 유틸 ──
    function getCached(year, month) {
      try { return JSON.parse(localStorage.getItem(`wd_pnl_${year}_${month}`)); } catch(e) { return null; }
    }
    function saveCache(year, month, data) {
      try { localStorage.setItem(`wd_pnl_${year}_${month}`, JSON.stringify(data)); } catch(e) {}
    }
    function showToast(msg) {
      let t = document.getElementById('toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'toast';
        t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3a3f47;color:#c9a055;font-size:12px;font-weight:700;padding:8px 18px;border-radius:20px;z-index:9999;opacity:0;transition:opacity 0.3s';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => { t.style.opacity = '0'; }, 2000);
    }

    async function loadAllData() {
      const year = APP_STATE.currentYear, month = APP_STATE.currentMonth;
      const pm = month === 1 ? 12 : month - 1;
      const py = month === 1 ? year - 1 : year;

      const cachedCur  = getCached(year, month);
      const cachedPrev = getCached(py, pm);

      if (cachedCur || cachedPrev) {
        APP_STATE.data     = cachedCur;
        APP_STATE.prevData = cachedPrev;
        document.getElementById('loadingScreen').style.display = 'none';
        stopLoadingAnimation();
        renderUI();
        refreshInBackground(year, month, py, pm);
      } else {
        document.getElementById('loadingScreen').style.display = 'flex';
        startLoadingAnimation();
        try {
          const [current, prev] = await Promise.all([
            fetchMonthData(year, month),
            fetchMonthData(py, pm)
          ]);
          APP_STATE.data = current;
          APP_STATE.prevData = prev;
          if (current) saveCache(year, month, current);
          if (prev)    saveCache(py, pm, prev);
          renderUI();
        } catch(e) {
          alert('서버 연결 실패: ' + e.message);
        } finally {
          stopLoadingAnimation();
          document.getElementById('loadingScreen').style.display = 'none';
        }
      }
    }

    async function refreshInBackground(year, month, py, pm) {
      try {
        const [current, prev] = await Promise.all([
          fetchMonthData(year, month),
          fetchMonthData(py, pm)
        ]);
        let updated = false;
        if (current) { APP_STATE.data = current;     saveCache(year, month, current); updated = true; }
        if (prev)    { APP_STATE.prevData = prev;     saveCache(py, pm, prev);         updated = true; }
        if (updated) { renderUI(); showToast('✓ 최신 데이터 반영'); }
      } catch(e) {}
    }

    async function fetchMonthData(year, month) {
      const url = `${APP_CONFIG.API_ENDPOINT}?token=${APP_STATE.password}&branch=${APP_CONFIG.BRANCH}&year=${year}&month=${month}&action=getProfitLoss`;
      const res = await fetch(url);
      const result = await res.json();
      if (result.success) return parsePnlData(result.pnlData, result.latestDay);
      return null;
    }

    function parsePnlData(pnlData, latestDay) {
      const map = {};
      pnlData.forEach(item => {
        const k = item.label.replace(/\s/g, '').replace(/[0-9.%]/g, '');
        map[k] = item.value;
      });
      const getV = k => {
        const t = k.replace(/\s/g, '').replace(/[()]/g, '');
        if (map[t] !== undefined) return map[t];
        const fk = Object.keys(map).find(key =>
          key.includes(t) || t.includes(key) ||
          key.replace(/[()&,]/g, '').includes(t.replace(/[()&,]/g, ''))
        );
        return fk ? map[fk] : 0;
      };
      return {
        revenue: {
          total: getV('매출액'),
          items: { '현금매출': getV('현금매출'), '카드매출': getV('카드매출'), '배달매출': getV('배달매출') }
        },
        cogs: {
          total: getV('매출원가'),
          items: {
            '육류원가': { total: getV('육류원가'), items: { '고기값': getV('고기값') } },
            '식자재&공산품': {
              total: getV('식자재&공산품') || getV('식자재공산품'),
              items: {
                '미락': getV('미락'), '콩나물': getV('콩나물'),
                '가게카드': getV('가게카드네이버쿠팡특양') || getV('가게카드'),
                '키위': getV('키위본성') || getV('키위'),
                '가게내부카드': getV('가게내부카드'), '가게외부카드': getV('가게외부카드')
              }
            },
            '주류원가': getV('주류원가'),
            '음료원가': getV('음료원가')
          }
        },
        grossProfit: getV('매출이익'),
        laborCost: {
          total: getV('인건비'),
          items: { '직원 급여': getV('직원급여') || getV('직원'), '알바 급여': getV('알바급여') || getV('알바') }
        },
        rent: getV('임대료'),
        fixedCost: {
          total: getV('고정비'),
          items: {
            '화재보험': getV('화재보험'),
            '정수기렌탈': getV('정수기렌탈') || getV('정수기'),
            'KT통신요금': getV('KT통신요금') || getV('통신요금'),
            '세무사비용': getV('세무사비용'),
            '가게위생비': getV('가게위생비') || getV('위생비'),
            '테이블링': getV('테이블링'),
            '식비': getV('식비')
          }
        },
        variableCost: {
          total: getV('변동비'),
          items: {
            '카드수수료': getV('카드수수료'),
            '매장관리비': getV('매장관리비전기수도') || getV('매장관리비'),
            '가스사용료': getV('가스사용료매장') || getV('가스사용료'),
            '네이버광고': getV('네이버광고비용'),
            '기타잡비용': getV('기타잡비용') || getV('기타'),
            '기타세금': getV('기타세금'),
            '4대보험': getV('4대보험')
          }
        },
        operatingProfit: getV('영업이익'),
        taxReserve: {
          total: getV('세금예수금'),
          items: { '부가세 예수금': getV('부가세예수금') || getV('부가세'), '종합소득세 예수금': getV('종합소득세예수금') || getV('종소세') }
        },
        netProfit: getV('매출순이익') || getV('순이익'),
        lastUpdatedDay: latestDay
      };
    }

    function renderUI() {
      const d = APP_STATE.data;
      if (!d) return;
      renderKeyMetrics(d, APP_STATE.prevData);
      renderTrafficLights(d);
      renderGoalAndProjection(d);
      renderCompareTable(d, APP_STATE.prevData);
      renderAccounts(d);
    }

    function renderKeyMetrics(d, prevData) {
      const revenue = d.revenue.total || 0;
      const net = d.netProfit || 0;
      const rate = revenue > 0 ? (net / revenue * 100).toFixed(1) : '0.0';
      document.getElementById('metricRevenue').textContent = fmt만(revenue);
      document.getElementById('metricNetProfit').textContent = fmt만(net);
      document.getElementById('metricNetRate').textContent = rate + '%';
      document.getElementById('metricDay').textContent = (d.lastUpdatedDay || '-') + '일 기준';
      if (prevData) {
        const rc = prevData.revenue.total > 0 ? ((revenue - prevData.revenue.total) / prevData.revenue.total * 100).toFixed(1) : null;
        const nc = prevData.netProfit !== 0 ? ((net - prevData.netProfit) / Math.abs(prevData.netProfit) * 100).toFixed(1) : null;
        setChange('metricRevenueChange', rc);
        setChange('metricNetChange', nc);
      }
    }

    function setChange(id, val) {
      const el = document.getElementById(id);
      if (val === null) { el.textContent = ''; return; }
      const up = parseFloat(val) >= 0;
      el.textContent = (up ? '▲ +' : '▼ ') + val + '%';
      el.className = 'metric-change ' + (up ? 'up' : 'down');
    }

    function renderTrafficLights(d) {
      const rev = d.revenue.total || 1;
      const items = [
        { name: '매출원가', val: d.cogs.total, good: 40, warn: 50 },
        { name: '고기값',   val: d.cogs.items['육류원가'].items['고기값'], good: 25, warn: 32 },
        { name: '임대료',   val: d.rent, good: 8, warn: 12 },
        { name: '인건비',   val: d.laborCost.total, good: 25, warn: 30 }
      ];
      document.getElementById('trafficGrid').innerHTML = items.map(item => {
        const pct = (item.val / rev * 100);
        const color = pct <= item.good ? 'green' : pct <= item.warn ? 'yellow' : 'red';
        return `
          <div class="traffic-item">
            <div class="traffic-dot ${color}"></div>
            <div class="traffic-info">
              <div class="traffic-name">${item.name}</div>
              <div class="traffic-pct">${pct.toFixed(1)}%</div>
              <div class="traffic-target">기준 ${item.good}% 이하</div>
            </div>
          </div>`;
      }).join('');
    }

    function renderGoalAndProjection(d) {
      const year = APP_STATE.currentYear;
      const month = APP_STATE.currentMonth;
      const daysInMonth = new Date(year, month, 0).getDate();
      const latestDay = d.lastUpdatedDay || 1;
      const goalKey = `wondang_goal_${year}_${month}`;
      const savedGoalMan = parseInt(localStorage.getItem(goalKey)) || 0;
      const savedGoal = savedGoalMan * 10000;
      const revenue = d.revenue.total || 0;
      const net = d.netProfit || 0;

      const ach = savedGoal > 0 ? Math.round(revenue / savedGoal * 100) : 0;
      const barColor = ach >= 100 ? '#4ade80' : ach >= 70 ? '#fbbf24' : '#f87171';
      document.getElementById('goalSection').innerHTML = `
        <div class="goal-input-row">
          <input type="number" id="goalInput" class="goal-input" placeholder="목표매출(만원)" value="${savedGoalMan > 0 ? savedGoalMan : ''}" inputmode="numeric">
          <button onclick="saveGoal()" class="goal-btn">저장</button>
        </div>
        ${savedGoal > 0 ? `
          <div class="goal-pct">${ach}<span style="font-size:12px;font-weight:600;color:#8b8b8b;">%</span></div>
          <div class="goal-bar-wrap"><div class="goal-bar" style="width:${Math.min(ach, 100)}%;background:${barColor};"></div></div>
          <div class="goal-detail">${fmt만(revenue)} / ${savedGoalMan.toLocaleString()}만원</div>
        ` : '<div class="goal-hint">목표 매출을 입력하세요</div>'}
      `;

      const projRev = latestDay > 0 ? Math.round(d.revenue.total / latestDay * daysInMonth) : 0;
      const projNet = latestDay > 0 ? Math.round(net / latestDay * daysInMonth) : 0;
      document.getElementById('projectionSection').innerHTML = `
        <div class="proj-row">
          <div class="proj-label">예상 매출</div>
          <div class="proj-value">${fmt만(projRev)}</div>
        </div>
        <div class="proj-divider"></div>
        <div class="proj-row">
          <div class="proj-label">예상 순이익</div>
          <div class="proj-value ${projNet >= 0 ? 'up' : 'down'}">${fmt만(projNet)}</div>
        </div>
        <div class="proj-hint">${latestDay}일 → ${daysInMonth}일 환산</div>
      `;
    }

    function saveGoal() {
      const val = document.getElementById('goalInput').value;
      if (!val) return;
      const key = `wondang_goal_${APP_STATE.currentYear}_${APP_STATE.currentMonth}`;
      localStorage.setItem(key, val);
      renderGoalAndProjection(APP_STATE.data);
    }

    function renderCompareTable(d, prev) {
      const rows = [
        { name: '매출액', cur: d.revenue.total,                          prv: prev ? prev.revenue.total : null },
        { name: '순이익', cur: d.netProfit,                              prv: prev ? prev.netProfit : null },
        { name: '고기값', cur: d.cogs.items['육류원가'].items['고기값'],  prv: prev ? prev.cogs.items['육류원가'].items['고기값'] : null },
        { name: '인건비', cur: d.laborCost.total,                        prv: prev ? prev.laborCost.total : null },
        { name: '임대료', cur: d.rent,                                   prv: prev ? prev.rent : null }
      ];
      document.getElementById('compareTable').innerHTML = rows.map(r => {
        const diff = (r.prv !== null && r.prv !== 0) ? ((r.cur - r.prv) / Math.abs(r.prv) * 100) : null;
        let badge = '';
        if (diff === null) badge = `<span class="compare-badge badge-eq">-</span>`;
        else if (Math.abs(diff) < 0.5) badge = `<span class="compare-badge badge-eq">동일</span>`;
        else if (diff > 0) badge = `<span class="compare-badge badge-up">▲ +${diff.toFixed(1)}%</span>`;
        else badge = `<span class="compare-badge badge-dn">▼ ${diff.toFixed(1)}%</span>`;
        return `
          <div class="compare-row">
            <span class="compare-name">${r.name}</span>
            <span class="compare-val">${fmt만(r.cur)}</span>
            ${badge}
          </div>`;
      }).join('');
    }

    function renderAccounts(d) {
      const container = document.getElementById('accountsGrid');
      const accounts = [
        { icon: ICONS.revenue, label: '매출액', value: d.revenue.total, positive: true,
          items: [{ label: '현금매출', value: d.revenue.items['현금매출'] }, { label: '카드매출', value: d.revenue.items['카드매출'] }, { label: '배달매출', value: d.revenue.items['배달매출'] }] },
        { icon: ICONS.cogs, label: '매출원가', value: d.cogs.total, negative: true,
          items: [
            { label: '육류원가', value: d.cogs.items['육류원가'].total, hasSubItems: true,
              subItems: [{ label: '고기값', value: d.cogs.items['육류원가'].items['고기값'] }] },
            { label: '식자재&공산품', value: d.cogs.items['식자재&공산품'].total, hasSubItems: true,
              subItems: [
                { label: '미락', value: d.cogs.items['식자재&공산품'].items['미락'] },
                { label: '콩나물', value: d.cogs.items['식자재&공산품'].items['콩나물'] },
                { label: '가게카드', value: d.cogs.items['식자재&공산품'].items['가게카드'] },
                { label: '키위', value: d.cogs.items['식자재&공산품'].items['키위'] },
                { label: '가게내부카드', value: d.cogs.items['식자재&공산품'].items['가게내부카드'] },
                { label: '가게외부카드', value: d.cogs.items['식자재&공산품'].items['가게외부카드'] }
              ]},
            { label: '주류원가', value: d.cogs.items['주류원가'] },
            { label: '음료원가', value: d.cogs.items['음료원가'] }
          ]},
        { icon: ICONS.profit, label: '매출이익', value: d.grossProfit, positive: true },
        { icon: ICONS.labor, label: '인건비', value: d.laborCost.total, negative: true,
          items: [{ label: '직원 급여', value: d.laborCost.items['직원 급여'] }, { label: '알바 급여', value: d.laborCost.items['알바 급여'] }] },
        { icon: ICONS.rent, label: '임대료', value: d.rent, negative: true },
        { icon: ICONS.fixed, label: '고정비', value: d.fixedCost.total, negative: true,
          items: [
            { label: '화재보험', value: d.fixedCost.items['화재보험'] },
            { label: '정수기렌탈', value: d.fixedCost.items['정수기렌탈'] },
            { label: 'KT통신요금', value: d.fixedCost.items['KT통신요금'] },
            { label: '세무사비용', value: d.fixedCost.items['세무사비용'] },
            { label: '가게위생비', value: d.fixedCost.items['가게위생비'] },
            { label: '테이블링', value: d.fixedCost.items['테이블링'] },
            { label: '식비', value: d.fixedCost.items['식비'] }
          ]},
        { icon: ICONS.variable, label: '변동비', value: d.variableCost.total, negative: true,
          items: [
            { label: '카드수수료', value: d.variableCost.items['카드수수료'] },
            { label: '매장관리비', value: d.variableCost.items['매장관리비'] },
            { label: '가스사용료', value: d.variableCost.items['가스사용료'] },
            { label: '네이버광고', value: d.variableCost.items['네이버광고'] },
            { label: '기타잡비용', value: d.variableCost.items['기타잡비용'] },
            { label: '기타세금', value: d.variableCost.items['기타세금'] },
            { label: '4대보험', value: d.variableCost.items['4대보험'] }
          ]},
        { icon: ICONS.operating, label: '영업이익', value: d.operatingProfit, positive: true },
        { icon: ICONS.tax, label: '세금예수금', value: d.taxReserve.total, negative: true,
          items: [{ label: '부가세', value: d.taxReserve.items['부가세 예수금'] }, { label: '종소세', value: d.taxReserve.items['종합소득세 예수금'] }] },
        { icon: ICONS.net, label: '매출 순이익', value: d.netProfit, positive: true }
      ];

      container.innerHTML = accounts.map((acc, idx) => {
        const hasItems = acc.items && acc.items.length > 0;
        const vc = acc.positive ? 'positive' : (acc.negative ? 'negative' : '');
        const cid = `acc-${idx}`;
        return `
          <div class="account-card" id="${cid}" data-clickable="${hasItems}">
            <div class="account-header">
              <div class="account-icon">${acc.icon}</div>
              <div class="account-main">
                <div class="account-label">${acc.label}</div>
                <div class="account-value ${vc}">${formatCurrency(acc.value)}</div>
              </div>
              ${hasItems ? `<div class="account-chevron">${ICONS.chevron}</div>` : ''}
            </div>
            ${hasItems ? `
              <div class="account-details">
                ${acc.items.map((item, ii) => {
                  const iid = `${cid}-i-${ii}`;
                  if (item.hasSubItems) {
                    return `
                      <div class="detail-item detail-item-nested" id="${iid}" data-sub-clickable="true">
                        <div style="display:flex;justify-content:space-between;align-items:center;width:100%">
                          <div style="display:flex;align-items:center;gap:5px;flex:1">
                            <div class="account-chevron" style="width:15px;height:15px">${ICONS.chevron}</div>
                            <div class="detail-label">${item.label}</div>
                          </div>
                          <div class="detail-value ${vc}">${formatCurrency(item.value)}</div>
                        </div>
                        <div class="sub-details">
                          ${item.subItems.map(s => `
                            <div class="sub-detail-item">
                              <div class="detail-label" style="padding-left:12px">${s.label}</div>
                              <div class="detail-value ${vc}">${formatCurrency(s.value)}</div>
                            </div>`).join('')}
                        </div>
                      </div>`;
                  }
                  return `
                    <div class="detail-item">
                      <div class="detail-label">${item.label}</div>
                      <div class="detail-value ${vc}">${formatCurrency(item.value)}</div>
                    </div>`;
                }).join('')}
              </div>` : ''}
          </div>`;
      }).join('');

      container.querySelectorAll('.account-card[data-clickable="true"]').forEach(card => {
        card.addEventListener('click', function(e) {
          if (e.target.closest('.detail-item-nested')) return;
          const details = this.querySelector('.account-details');
          if (!details) return;
          this.classList.toggle('expanded');
          details.classList.toggle('expanded');
        });
      });

      container.querySelectorAll('.detail-item-nested[data-sub-clickable="true"]').forEach(item => {
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          const sub = this.querySelector('.sub-details');
          if (!sub) return;
          const wasExpanded = this.classList.contains('expanded');
          this.classList.toggle('expanded');
          sub.classList.toggle('expanded');
          const parent = this.closest('.account-card');
          if (parent) {
            if (!wasExpanded) parent.classList.add('has-nested-expanded');
            else if (!parent.querySelector('.detail-item-nested.expanded')) parent.classList.remove('has-nested-expanded');
          }
        });
      });
    }

    function formatCurrency(n) { return (n || 0).toLocaleString() + '원'; }

    function fmt만(n) {
      n = n || 0;
      if (n < 0) return '-' + fmt만(-n);
      if (n >= 100000000) return (n / 100000000).toFixed(1) + '억';
      if (n >= 10000) return Math.round(n / 10000).toLocaleString() + '만';
      return n.toLocaleString() + '원';
    }
  </script>
</body>
</html>
